<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CALC // Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <!-- Top bar -->
        <header class="calculator-header">
            <div class="brand">
                <span class="status-dot"></span>
                <span>CALC</span>
            </div>

            <span class="version">v1.0</span>
        </header>


        <!-- Display -->
        <section class="display">

            <div class="expression" id="expression">
                0
            </div>

            <div class="result" id="result">
                0
            </div>

        </section>


        <!-- Calculator buttons -->
        <section class="buttons">

            <!-- Row 1 -->
            <button class="btn function" data-action="clear">
                AC
            </button>

            <button class="btn function" data-action="backspace">
                ⌫
            </button>

            <button class="btn operator" data-operator="%">
                %
            </button>

            <button class="btn operator" data-operator="/">
                ÷
            </button>


            <!-- Row 2 -->
            <button class="btn number" data-number="7">
                7
            </button>

            <button class="btn number" data-number="8">
                8
            </button>

            <button class="btn number" data-number="9">
                9
            </button>

            <button class="btn operator" data-operator="*">
                ×
            </button>


            <!-- Row 3 -->
            <button class="btn number" data-number="4">
                4
            </button>

            <button class="btn number" data-number="5">
                5
            </button>

            <button class="btn number" data-number="6">
                6
            </button>

            <button class="btn operator" data-operator="-">
                −
            </button>


            <!-- Row 4 -->
            <button class="btn number" data-number="1">
                1
            </button>

            <button class="btn number" data-number="2">
                2
            </button>

            <button class="btn number" data-number="3">
                3
            </button>

            <button class="btn operator" data-operator="+">
                +
            </button>


            <!-- Row 5 -->
            <button class="btn number zero" data-number="0">
                0
            </button>

            <button class="btn number" data-number=".">
                .
            </button>

            <button class="btn equals" data-action="calculate">
                =
            </button>

        </section>


        <!-- Footer -->
        <footer class="calculator-footer">
            <span>SECURE CALCULATION SYSTEM</span>
            <span>● ONLINE</span>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
